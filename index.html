<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriAD | Premium Thermal Lunch Boxes</title>

    <link rel="icon" type="image/png" href="images/Logo.png" />
    <!-- Meta -->
    <meta
      name="description"
      content="TriAD - Premium thermal lunch boxes for modern professionals"
    />

    <!-- External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css"
    />
    <style>
      #footer-container {
        min-height: 32rem;
      }

      @media (min-width: 768px) {
        #footer-container {
          min-height: 21rem;
        }
      }

      /* Reserve the measured home partial heights before asynchronous injection. */
      #hero-container {
        min-height: 45.9375rem;
      }

      #about-container {
        min-height: 64.59375rem;
      }

      #features-container {
        min-height: 68.5rem;
      }

      @media (min-width: 1024px) {
        #hero-container {
          min-height: 41.833rem;
        }

        #about-container {
          min-height: 37.25rem;
        }

        #features-container {
          min-height: 31.25rem;
        }
      }
    </style>

    <!-- Styles -->
  </head>
  <body class="antialiased text-brand-dark">
    <!-- Header -->
    <div id="header-container"></div>

    <!-- Nội dung trang chủ -->
    <div id="page-content">
      <!-- Hero -->
      <div id="hero-container"></div>
      <!-- About -->
      <div id="about-container"></div>
      <!-- Features -->
      <div id="features-container"></div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed top-20 right-4 z-50 space-y-2 pointer-events-none"
    ></div>

    <!-- Cart Drawer -->
    <div id="cart-drawer-container"></div>

    <!--- Auth Modal -->
    <div id="auth-modal-container"></div>

    <!-- Product Modal -->
    <div id="product-modal-container"></div>

    <!-- Checkout Modal -->
    <div id="checkout-modal-container"></div>

    <!-- Success Modal -->
    <div id="success-modal-container"></div>

    <!-- Overlay -->
    <div
      id="cart-overlay"
      class="fixed inset-0 bg-black/40 z-[60] hidden opacity-0 transition-opacity duration-300"
    ></div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module" src="src/index.js"></script>
  </body>
</html>
