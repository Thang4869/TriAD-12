<section id="reviews" class="py-20 bg-white border-t border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <span class="text-sm font-medium text-brand-accent tracking-widest uppercase">Testimonials</span>
            <h2 class="text-3xl md:text-4xl font-bold mt-2">What Our Customers Say</h2>
            <div class="flex items-center justify-center gap-1 mt-3">
                <i class="ph-fill ph-star text-yellow-400 text-xl"></i>
                <i class="ph-fill ph-star text-yellow-400 text-xl"></i>
                <i class="ph-fill ph-star text-yellow-400 text-xl"></i>
                <i class="ph-fill ph-star text-yellow-400 text-xl"></i>
                <i class="ph-fill ph-star text-yellow-400 text-xl"></i>
                <span class="ml-2 font-medium" id="avg-rating">4.9/5</span>
                <span class="text-brand-gray text-sm" id="total-reviews">(0 reviews)</span>
            </div>
        </div>

        <!-- Review Grid -->
        <div id="reviews-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Reviews sẽ được render bằng JavaScript -->
        </div>

        <!-- Review Form -->
        <div class="mt-12 max-w-2xl mx-auto bg-gray-50 p-8 rounded-2xl">
            <h3 class="text-xl font-bold text-center mb-4">Share Your Experience</h3>
            <form id="review-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="review-name" placeholder="Your Name" class="p-3 border border-gray-200 rounded-lg focus:outline-none focus:border-black">
                    <input type="email" id="review-email" placeholder="Email" class="p-3 border border-gray-200 rounded-lg focus:outline-none focus:border-black">
                </div>
                <div>
                    <textarea id="review-content" rows="3" placeholder="Write your review..." class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:border-black resize-none"></textarea>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium">Rating:</span>
                    <div class="flex gap-1">
                        <i class="ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors star-rating" data-value="1"></i>
                        <i class="ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors star-rating" data-value="2"></i>
                        <i class="ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors star-rating" data-value="3"></i>
                        <i class="ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors star-rating" data-value="4"></i>
                        <i class="ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors star-rating" data-value="5"></i>
                    </div>
                    <span id="selected-rating" class="text-sm text-brand-gray ml-2">0/5</span>
                </div>
                <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 transition-colors font-medium">
                    Submit Review
                </button>
            </form>
        </div>
    </div>
</section>

<script>
    // ===== REVIEWS DATA MANAGEMENT =====
    const STORAGE_KEY = 'triad_reviews';

    // Lấy danh sách reviews từ localStorage
    function getReviews() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        } catch {
            return [];
        }
    }

    // Lưu reviews vào localStorage
    function saveReviews(reviews) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    }

    // Tạo ID duy nhất
    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // Format ngày tháng
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));
        
        if (diff === 0) return 'Today';
        if (diff === 1) return 'Yesterday';
        if (diff < 7) return `${diff} days ago`;
        if (diff < 30) return `${Math.floor(diff / 7)} weeks ago`;
        if (diff < 365) return `${Math.floor(diff / 30)} months ago`;
        return `${Math.floor(diff / 365)} years ago`;
    }

    // ===== RENDER REVIEWS =====
    function renderReviews() {
        const reviews = getReviews();
        const grid = document.getElementById('reviews-grid');
        
        if (!grid) return;

        // Cập nhật thống kê
        updateStats(reviews);

        if (reviews.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <i class="ph ph-chat-circle text-6xl text-gray-300"></i>
                    <p class="mt-4 text-gray-500">No reviews yet. Be the first to share your experience!</p>
                </div>
            `;
            return;
        }

        // Lấy 3 review mới nhất
        const sortedReviews = [...reviews].reverse().slice(0, 3);
        
        grid.innerHTML = sortedReviews.map(review => `
            <div class="bg-gray-50 p-6 rounded-2xl hover:shadow-md transition-all">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 rounded-full ${getAvatarColor(review.name)} flex items-center justify-center text-white font-bold text-lg border-2 border-white shadow-sm flex-shrink-0">
                        ${getInitials(review.name)}
                    </div>
                    <div>
                        <h4 class="font-semibold">${escapeHtml(review.name)}</h4>
                        <div class="flex items-center gap-1">
                            ${renderStars(review.rating)}
                        </div>
                    </div>
                </div>
                <p class="text-brand-gray text-sm leading-relaxed">"${escapeHtml(review.content)}"</p>
                <div class="mt-3 text-xs text-brand-gray">
                    <span>Verified Purchase</span>
                    <span class="mx-2">•</span>
                    <span>${formatDate(review.createdAt)}</span>
                </div>
            </div>
        `).join('');
    }

    // Cập nhật thống kê
    function updateStats(reviews) {
        const avgEl = document.getElementById('avg-rating');
        const totalEl = document.getElementById('total-reviews');
        
        if (reviews.length === 0) {
            if (avgEl) avgEl.textContent = '0/5';
            if (totalEl) totalEl.textContent = '(0 reviews)';
            return;
        }

        const total = reviews.length;
        const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
        const avg = (sum / total).toFixed(1);
        
        if (avgEl) avgEl.textContent = `${avg}/5`;
        if (totalEl) totalEl.textContent = `(${total} reviews)`;
    }

    // Render sao
    function renderStars(rating) {
        let stars = '';
        for (let i = 1; i <= 5; i++) {
            stars += `<i class="ph-fill ph-star text-yellow-400 text-sm"></i>`;
        }
        return stars;
    }

    // Lấy màu nền avatar
    function getAvatarColor(name) {
        const colors = [
            'bg-brand-accent',
            'bg-brand-orange',
            'bg-green-500',
            'bg-purple-500',
            'bg-pink-500',
            'bg-blue-500'
        ];
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
    }

    // Lấy chữ cái đầu
    function getInitials(name) {
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    // Escape HTML để tránh XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== SUBMIT REVIEW =====
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('review-form');
        const stars = document.querySelectorAll('.star-rating');
        const ratingDisplay = document.getElementById('selected-rating');
        let selectedRating = 0;

        // Star rating logic
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                selectedRating = index + 1;
                stars.forEach((s, i) => {
                    if (i <= index) {
                        s.className = 'ph-fill ph-star text-xl text-yellow-400 cursor-pointer';
                    } else {
                        s.className = 'ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors';
                    }
                });
                if (ratingDisplay) {
                    ratingDisplay.textContent = `${selectedRating}/5`;
                }
            });

            star.addEventListener('mouseenter', () => {
                stars.forEach((s, i) => {
                    if (i <= index) {
                        s.className = 'ph-fill ph-star text-xl text-yellow-400 cursor-pointer';
                    }
                });
            });

            star.addEventListener('mouseleave', () => {
                stars.forEach((s, i) => {
                    if (i >= selectedRating) {
                        s.className = 'ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors';
                    }
                });
            });
        });

        // Form submit
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('review-name')?.value.trim();
                const email = document.getElementById('review-email')?.value.trim();
                const content = document.getElementById('review-content')?.value.trim();

                // Validation
                if (!name) {
                    showToast('Please enter your name.', 'warning');
                    return;
                }
                if (!content) {
                    showToast('Please write your review.', 'warning');
                    return;
                }
                if (selectedRating === 0) {
                    showToast('Please select a rating.', 'warning');
                    return;
                }

                // Tạo review mới
                const newReview = {
                    id: generateId(),
                    name: name,
                    email: email || '',
                    content: content,
                    rating: selectedRating,
                    createdAt: new Date().toISOString()
                };

                // Lưu vào localStorage
                const reviews = getReviews();
                reviews.push(newReview);
                saveReviews(reviews);

                // Reset form
                form.reset();
                selectedRating = 0;
                stars.forEach(s => {
                    s.className = 'ph ph-star text-xl text-gray-300 cursor-pointer hover:text-yellow-400 transition-colors';
                });
                if (ratingDisplay) {
                    ratingDisplay.textContent = '0/5';
                }

                // Re-render
                renderReviews();
                
                // Thông báo thành công
                showToast('Review submitted successfully! Thank you for your feedback.', 'success');
            });
        }

        // Render reviews ban đầu
        renderReviews();
    });

    // ===== TOAST NOTIFICATION =====
    function showToast(message, type = 'info') {
        // Sử dụng toast có sẵn nếu có
        if (window.toast) {
            window.toast[type](type.charAt(0).toUpperCase() + type.slice(1), message);
            return;
        }

        // Fallback: tạo toast tạm thời
        const colors = {
            success: '#22c55e',
            warning: '#f59e0b',
            error: '#ef4444',
            info: '#3b82f6'
        };

        const toast = document.createElement('div');
        toast.style.cssText = `
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: ${colors[type] || colors.info};
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 420px;
        `;
        toast.textContent = message;
        document.body.appendChild(toast);

        // Hiển thị
        requestAnimationFrame(() => {
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
        });

        // Tự động ẩn
        setTimeout(() => {
            toast.style.transform = 'translateY(20px)';
            toast.style.opacity = '0';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }, 3500);
    }
</script>
