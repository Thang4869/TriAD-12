<div
  id="success-modal"
  class="fixed inset-0 bg-black/60 z-[100] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4"
>
  <div
    class="bg-white w-full max-w-md rounded-xl shadow-2xl p-8 text-center transform scale-95 transition-transform duration-300"
  >
    <div
      class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"
    >
      <i class="ph-fill ph-check-circle text-4xl text-green-500"></i>
    </div>
    <h2 class="text-2xl font-bold mb-2">Order Placed Successfully!</h2>
    <p class="text-gray-500 mb-6">
      Thank you for your purchase. We'll send you a confirmation email shortly.
    </p>
    <p class="text-sm font-medium mb-6">
      Order <span id="success-order-id"></span>
    </p>
    <div class="text-left border-t border-gray-200 pt-4 mb-6 space-y-2 text-sm">
      <div class="flex justify-between"><span>Subtotal</span><span id="success-subtotal"></span></div>
      <div class="flex justify-between"><span>Tax</span><span id="success-tax"></span></div>
      <div class="flex justify-between"><span>Shipping</span><span id="success-shipping"></span></div>
      <div class="flex justify-between"><span>Discount <span id="success-discount-code"></span></span><span id="success-discount"></span></div>
      <div class="flex justify-between border-t border-gray-200 pt-2 font-bold"><span>Total</span><span id="success-total"></span></div>
    </div>
    <button
      id="success-close-btn"
      class="px-8 py-3 bg-black text-white rounded hover:bg-gray-800 transition-colors"
    >
      Continue Shopping
    </button>
  </div>
</div>
