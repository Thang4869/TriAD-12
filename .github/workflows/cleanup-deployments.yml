name: Cleanup Stale Deployments

on:
  pull_request:
    types: [closed]
  delete:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup preview deployments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let envNames = [];

            if (context.eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              envNames.push(`preview-${prNumber}`);
            } else if (context.eventName === 'delete' && context.payload.ref_type === 'branch') {
              const deletedBranch = context.payload.ref.replace(/\//g, '-');
              envNames.push(`preview-branch-${deletedBranch}`);
            }

            if (envNames.length === 0) {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner,
                repo,
                per_page: 100
              });

              for (const d of deployments) {
                const env = d.environment || '';
                if (!env.startsWith('preview-')) continue;

                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: d.id,
                  state: 'inactive',
                  description: `Auto cleanup (${context.eventName})`
                });
                core.info(`Deactivated ${d.id} (${env})`);
              }
            } else {
              for (const envName of envNames) {
                const deployments = await github.paginate(github.rest.repos.listDeployments, {
                  owner,
                  repo,
                  environment: envName,
                  per_page: 100
                });

                for (const d of deployments) {
                  await github.rest.repos.createDeploymentStatus({
                    owner,
                    repo,
                    deployment_id: d.id,
                    state: 'inactive',
                    description: `Auto cleanup (${context.eventName})`
                  });
                  core.info(`Deactivated ${d.id} (${envName})`);
                }
              }
            }
