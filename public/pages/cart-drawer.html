<div
  id="cart-drawer"
  class="fixed top-0 right-0 h-full w-full max-w-[400px] bg-white z-[70] transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl"
>
  <div
    class="flex justify-between items-center p-6 border-b border-gray-100 bg-gray-50/50"
  >
    <h2 class="text-xl font-medium tracking-wide">Shopping cart</h2>
    <button
      id="close-cart-btn"
      class="text-gray-400 hover:text-black transition-colors"
    >
      <i class="ph ph-x text-2xl"></i>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-6 cart-scroll"></div>

  <div class="p-6 bg-white border-t border-gray-100 space-y-4">
    <button
      class="flex items-center text-brand-orange text-sm font-medium gap-2 mb-4 hover:underline"
    >
      <i class="ph ph-tag text-lg"></i> Enter Discount Code
    </button>
    <div class="flex justify-between text-lg font-medium">
      <p>Total</p>
      <p id="cart-total">0 ₫</p>
    </div>
    <p class="text-xs text-gray-500 mb-4">
      Taxes and shipping fees are calculated at checkout.
    </p>
    <button
      id="checkout-btn"
      class="w-full bg-brand-orange text-white py-4 font-medium rounded hover:bg-orange-600 transition-colors tracking-wide text-lg"
    >
      Checkout
    </button>
    <button
      class="w-full bg-white text-brand-orange border border-brand-orange py-4 font-medium rounded hover:bg-orange-50 transition-colors tracking-wide"
    >
      View cart
    </button>
  </div>
</div>
